name: Version Packages

# Changesets "Version Packages" PR automation (versioning only — does NOT publish).
#
# - A feature PR merging with pending .changeset/*.md files makes this workflow
#   create or update the "Version Packages" PR against main (changeset version +
#   jsr.json sync).
# - Merging that Version Packages PR bumps package.json/jsr.json and writes
#   changelogs. It does NOT publish here.
#
# Publishing to npm + JSR is owned entirely by release.yml, which holds the npm
# OIDC Trusted Publisher. release.yml observes the same successful main CI run
# directly and admits only merged Version Packages commits. This preserves the
# human CI actor required by JSR OIDC instead of replacing it with
# github-actions[bot] through a nested workflow dispatch. npm Trusted Publishing
# keys on the workflow filename, so only release.yml publishes packages.
#
# CI owns validation on the main commit; this workflow starts only after CI
# succeeds and does not rerun unit/docs/Playwright gates.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
          token: ${{ secrets.CHANGESETS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Explain version PR workflow approval requirements
        uses: actions/github-script@v7
        env:
          CHANGESETS_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}
        with:
          script: |
            const { readdirSync } = require('node:fs');
            const pending = readdirSync('.changeset').some((name) => name.endsWith('.md') && name !== 'README.md');
            if (pending && !process.env.CHANGESETS_TOKEN) {
              core.warning('Set CHANGESETS_GITHUB_TOKEN to a dedicated App/PAT token with Contents and Pull requests write access. Without it, approve the Version Packages PR workflows before they expire. See docs/guides/releases.md.');
              await core.summary
                .addHeading('Version PR checks need approval')
                .addRaw('CHANGESETS_GITHUB_TOKEN is missing. Open the Version Packages PR and select **Approve workflows to run**, or configure the dedicated token described in docs/guides/releases.md.\n')
                .write();
            }

      # No `publish:` input — this workflow only opens/updates the Version
      # Packages PR. Publishing is release.yml's responsibility (it owns the npm
      # OIDC Trusted Publisher). With no pending changesets, changesets/action is
      # a no-op here instead of attempting an unauthorized npm publish.
      - name: Create or update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # The action reads this input; an env-only token is ignored.
          github-token: ${{ secrets.CHANGESETS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
